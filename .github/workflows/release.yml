name: Release

# ============================================================================
# Triggers on any pushed tag like v1.0.0 — bump "version" in
# src-tauri/tauri.conf.json AND package.json to match before tagging, e.g.:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# This repo is PUBLIC, so GitHub Actions runs on GitHub's own cloud runners
# for free with no billing/spending-limit concerns, and releases publish
# directly to this same repo's Releases page — no separate releases repo or
# extra token needed.
#
# "targets": "all" in tauri.conf.json's bundle config means this produces
# BOTH an .exe (NSIS) and a .msi installer per release automatically — both
# get uploaded, so the Releases page naturally offers both types for people
# to pick between.
# ============================================================================

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-action@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SUPABASE_DB_URL:   ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          tagName:     ${{ github.ref_name }}
          releaseName: "Zera ${{ github.ref_name }}"
          releaseBody: "See commit history for what changed in this version."
          releaseDraft: false
          prerelease:   false
